name: Essai sur téléphone virtuel

on:
  push:
    branches: [hey-jarvis]

jobs:
  essai:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - name: KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
      - name: SDK
        run: |
          SDKM=$(ls ${ANDROID_HOME:-$ANDROID_SDK_ROOT}/cmdline-tools/*/bin/sdkmanager | head -1)
          yes | "$SDKM" --licenses > /dev/null || true
          echo "sdk.dir=${ANDROID_HOME:-$ANDROID_SDK_ROOT}" > local.properties
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Modèles « Eh Jarvis »
        run: |
          set -e
          mkdir -p app/libs app/src/main/assets/reveil/fr app/src/main/assets/reveil/en
          R=https://github.com/k2-fsa/sherpa-onnx/releases/download
          curl -sSfL -o app/libs/sherpa-onnx.aar $R/v2.0.1/sherpa-onnx-2.0.1.aar
          curl -sSfL $R/asr-models/sherpa-onnx-streaming-zipformer-fr-kroko-2025-08-06.tar.bz2 | tar xj
          cp sherpa-onnx-streaming-zipformer-fr-kroko-2025-08-06/{encoder,decoder,joiner}.onnx sherpa-onnx-streaming-zipformer-fr-kroko-2025-08-06/tokens.txt app/src/main/assets/reveil/fr/
          curl -sSfL $R/kws-models/sherpa-onnx-kws-zipformer-gigaspeech-3.3M-2024-01-01.tar.bz2 | tar xj
          K=sherpa-onnx-kws-zipformer-gigaspeech-3.3M-2024-01-01
          for f in encoder decoder joiner; do cp $K/$f-epoch-12-avg-2-chunk-16-left-64.int8.onnx app/src/main/assets/reveil/en/$f.int8.onnx; done
          cp $K/tokens.txt app/src/main/assets/reveil/en/
      - name: Construire (avec x86_64 pour l'émulateur)
        run: gradle assembleDebug --no-daemon -Pabis=x86_64,arm64-v8a
      - name: Lancer l'appli sur Android 14
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: bash tests/essai-emulateur.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: journal-essai
          path: logcat*.txt
