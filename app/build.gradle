plugins { id "com.android.application" }

android {
    namespace "fr.jabran.jarvis"
    compileSdk 34
    defaultConfig {
        applicationId "fr.jabran.jarvis"
        minSdk 26
        targetSdk 34
        versionCode 28
        versionName "4.1"
        // « Eh Jarvis » : moteur sherpa-onnx seulement pour les téléphones (pas les émulateurs)
        ndk { abiFilters(*((project.findProperty("abis") ?: "arm64-v8a,armeabi-v7a").toString().split(","))) }
    }
    signingConfigs {
        // Clé fixe (secret GitHub JARVIS_CLE, déposée par la compilation) : chaque nouvelle
        // version s'installe par-dessus l'ancienne sans désinstaller ni perdre les réglages.
        debug {
            def cle = file("jarvis.p12")
            def mdp = System.getenv("JARVIS_CLE_MDP")
            if (cle.exists() && mdp) {
                storeFile cle
                storeType "pkcs12"
                storePassword mdp
                keyAlias "jarvis"
                keyPassword mdp
            }
        }
    }
    buildTypes {
        debug { minifyEnabled false }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    // « Eh Jarvis » (01/11/2026) : sherpa-onnx, le même moteur que « l'oreille plus » du PC.
    // Le fichier .aar et les modèles sont téléchargés par la compilation (voir .github/workflows).
    implementation files("libs/sherpa-onnx.aar")
    implementation "org.jetbrains.kotlin:kotlin-stdlib:2.0.21"
}
