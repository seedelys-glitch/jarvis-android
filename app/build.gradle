plugins { id "com.android.application" }

android {
    namespace "fr.jabran.jarvis"
    compileSdk 34
    defaultConfig {
        applicationId "fr.jabran.jarvis"
        minSdk 26
        targetSdk 34
        versionCode 20
        versionName "3.7"
    }
    signingConfigs {
        // Clé fixe (secret GitHub JARVIS_CLE, déposée par la compilation) : chaque nouvelle
        // version s'installe par-dessus l'ancienne sans désinstaller ni perdre les réglages.
        debug {
            def cle = file("jarvis.p12")
            def mdp = System.getenv("JARVIS_CLE_MDP")
            if (cle.exists() && mdp) {
                storeFile cle
                storeType "pkcs12"
                storePassword mdp
                keyAlias "jarvis"
                keyPassword mdp
            }
        }
    }
    buildTypes {
        debug { minifyEnabled false }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
