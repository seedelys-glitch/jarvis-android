name: Construire l'APK Jarvis

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - name: SDK Android (déjà présent sur la machine GitHub)
        run: |
          echo "ANDROID_HOME=${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          SDKM=$(ls ${ANDROID_HOME:-$ANDROID_SDK_ROOT}/cmdline-tools/*/bin/sdkmanager | head -1)
          yes | "$SDKM" --licenses > /dev/null || true
          echo "sdk.dir=${ANDROID_HOME:-$ANDROID_SDK_ROOT}" > local.properties
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Clé de signature fixe (secret JARVIS_CLE)
        env:
          JARVIS_CLE: ${{ secrets.JARVIS_CLE }}
        run: |
          # Toujours la même clé : Android accepte la mise à jour par-dessus l'ancienne version.
          # Le secret contient 2 lignes : le mot de passe, puis la clé en base64.
          if [ -n "$JARVIS_CLE" ]; then
            MDP=$(printf '%s\n' "$JARVIS_CLE" | sed -n 1p | tr -d ' \r')
            echo "::add-mask::$MDP"
            printf '%s\n' "$JARVIS_CLE" | sed -n '2,$p' | tr -d ' \r\n' | base64 -d > app/jarvis.p12
            echo "JARVIS_CLE_MDP=$MDP" >> "$GITHUB_ENV"
            echo "Clé fixe : oui"
          else
            echo "::warning::Secret JARVIS_CLE absent : signature aléatoire (il faudra désinstaller l'ancienne appli)."
          fi
      - name: Réveil « Eh Jarvis » (moteur sherpa-onnx + 2 modèles, tout reste dans le téléphone)
        run: |
          set -e
          mkdir -p app/libs app/src/main/assets/reveil/fr app/src/main/assets/reveil/en
          R=https://github.com/k2-fsa/sherpa-onnx/releases/download
          curl -sSfL -o app/libs/sherpa-onnx.aar $R/v2.0.1/sherpa-onnx-2.0.1.aar
          # français (Kroko) : écrit « Eh Jarvis » dit à la française + la commande
          curl -sSfL $R/asr-models/sherpa-onnx-streaming-zipformer-fr-kroko-2025-08-06.tar.bz2 | tar xj
          cp sherpa-onnx-streaming-zipformer-fr-kroko-2025-08-06/{encoder,decoder,joiner}.onnx sherpa-onnx-streaming-zipformer-fr-kroko-2025-08-06/tokens.txt app/src/main/assets/reveil/fr/
          # anglais (le même petit détecteur que le PC) : « Hey Jarvis » dit à l'anglaise
          curl -sSfL $R/kws-models/sherpa-onnx-kws-zipformer-gigaspeech-3.3M-2024-01-01.tar.bz2 | tar xj
          K=sherpa-onnx-kws-zipformer-gigaspeech-3.3M-2024-01-01
          for f in encoder decoder joiner; do cp $K/$f-epoch-12-avg-2-chunk-16-left-64.int8.onnx app/src/main/assets/reveil/en/$f.int8.onnx; done
          cp $K/tokens.txt app/src/main/assets/reveil/en/
          ls -la app/libs app/src/main/assets/reveil/*
      - name: Tests du réveil (mots, fin de discussion)
        run: |
          javac -encoding UTF-8 -d /tmp/t app/src/main/java/fr/jabran/jarvis/ReveilTexte.java app/src/main/java/fr/jabran/jarvis/AppsTexte.java tests/ReveilTexteTest.java tests/AppsTexteTest.java
          java -cp /tmp/t ReveilTexteTest
          java -cp /tmp/t AppsTexteTest
          node tests/competences.test.js
      - name: Construire
        run: gradle assembleDebug --no-daemon
      - name: Renommer
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk Jarvis.apk
          rm -f app/jarvis.p12
          # Empreinte de la signature (doit rester la même d'une version à l'autre)
          SIGNER=$(ls ${ANDROID_HOME:-$ANDROID_SDK_ROOT}/build-tools/*/apksigner | tail -1)
          "$SIGNER" verify --print-certs Jarvis.apk | grep -i "SHA-256" || true
      - uses: actions/upload-artifact@v4
        with:
          name: Jarvis-apk
          path: Jarvis.apk
      - name: Publier (lien de téléchargement)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.${{ github.run_number }}
          name: Jarvis v1.${{ github.run_number }}
          files: Jarvis.apk
          make_latest: true
