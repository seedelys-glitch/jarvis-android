name: Construire l'APK Jarvis

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - name: SDK Android (déjà présent sur la machine GitHub)
        run: |
          echo "ANDROID_HOME=${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          SDKM=$(ls ${ANDROID_HOME:-$ANDROID_SDK_ROOT}/cmdline-tools/*/bin/sdkmanager | head -1)
          yes | "$SDKM" --licenses > /dev/null || true
          echo "sdk.dir=${ANDROID_HOME:-$ANDROID_SDK_ROOT}" > local.properties
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Construire
        run: gradle assembleDebug --no-daemon
      - name: Renommer
        run: cp app/build/outputs/apk/debug/app-debug.apk Jarvis.apk
      - uses: actions/upload-artifact@v4
        with:
          name: Jarvis-apk
          path: Jarvis.apk
      - name: Publier (lien de téléchargement)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.${{ github.run_number }}
          name: Jarvis v1.${{ github.run_number }}
          files: Jarvis.apk
          make_latest: true
